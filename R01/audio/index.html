<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>鸭兔竞技 · 音效试听</title><style>body{margin:0;background:#121d30;color:#e8eaf2;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:36px 22px}h1{font-size:32px}p{color:#b4c3d6;line-height:1.7}.tag{color:#ffd17b;font-size:13px;letter-spacing:2px}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}article{background:#1b2b43;padding:22px;border:1px solid #354760;border-radius:12px}h2{font-size:20px;margin-top:0}audio{width:100%}a{color:#9edcff}button{background:#ffd17b;border:0;padding:10px 16px;border-radius:6px;font-weight:700}</style><main><div class="tag">BALLS / ROUND 01 / 音频概念小样</div><h1>听清楚每次状态变化</h1><p>六条原创程序合成音效。点击播放开始试听；尚未接入游戏，未完成真机或人工听感验收。三种视觉方案共享同一套声音，便于比较视觉方向。</p><button id="stop">全部停止</button><p>建议先调低设备音量，再逐条试听。</p><section id="cards"></section><p><a href="event_map.md">事件映射、来源与接入说明</a> · <a href="audio_metrics.json">测量数据</a></p></main><script>const items=[['cloud_transfer','雷云转移','0.30秒 · 下行电子提示，表示持云者改变'],['lightning','落雷','0.65秒 · 电噪爆裂与短低频尾声'],['rabbit_charge','兔子锻造蓄力','2.00秒 · 仅表现forge阶段，不表示蓄满'],['rabbit_hit','兔子重击','0.48秒 · 低频击打与金属尾音'],['forge','锻造敲击','0.20秒 · 可用于动画敲击帧'],['temper','淬火起效','0.42秒 · 上行三音，强调强化起效']];document.querySelector('#cards').innerHTML=items.map(([f,n,d])=>`<article><h2>${n}</h2><p>${d}</p><audio controls preload="metadata" src="${f}.wav"></audio><p><a download href="${f}.wav">下载 WAV</a></p></article>`).join('');const all=[...document.querySelectorAll('audio')];all.forEach(a=>a.addEventListener('play',()=>all.forEach(b=>{if(a!==b){b.pause();b.currentTime=0}})));document.querySelector('#stop').onclick=()=>all.forEach(a=>{a.pause();a.currentTime=0});</script></html>
