<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鸭兔竞技场 · 动效概念预览</title><style>*{box-sizing:border-box}body{margin:0;background:#101821;color:#f0eadc;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:28px;margin:8px 0}p{color:#b9c4cc;line-height:1.6}button,select{background:#253345;color:#fff;border:1px solid #576777;border-radius:8px;padding:12px;font:inherit}button{cursor:pointer}nav{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border:1px solid #52616b;border-radius:12px}#timeline{width:100%}.badge{color:#ffcf73;letter-spacing:2px;font-size:13px}#event{min-height:52px;background:#22303f;padding:14px;border-radius:8px;margin:14px 0}.small{font-size:13px}a{color:#ffcf73}</style><main><div class="badge">第一轮 · 独立编排概念 · 非游戏录屏</div><h1>雷云易主，蓄力重击</h1><p>同一段 8 秒演示，比较三套像素方向。参数来自当前源码，移动轨迹与碰撞时刻为编排；不代表完整战斗仿真。</p><nav><select id="theme" aria-label="视觉方向"><option value="A">甲 · 暖色玩具街机</option><option value="B">乙 · 暮色锻造工坊</option><option value="C">丙 · 青紫霓虹竞技</option></select><button id="play">播放</button><button id="restart">重播</button><button id="mute">声音：关</button><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="0.5">半速观察</option></select></nav><canvas id="scene" width="960" height="540" aria-label="鸭子与锻造兔竞技场动画"></canvas><input id="timeline" aria-label="演示时间" type="range" min="0" max="8" step="0.01" value="0"><div id="event" role="status"></div><p class="small">点击“声音：关”开启音效。演示结束自动停下；拖动进度不会播放声音。页面只读取同一交付包中的素材，不联网。</p><p class="small">锻造兔蓄力没有固定上限，显示累计数值。雷云落雷后归鸭子并重置 7 秒；碰撞转移归属。展示避雷针位于远处、未覆盖落雷目标的情境。血量以 100 为演示起点，省略基础碰撞伤害及其他机制。</p></main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'), $=s=>document.getElementById(s);
const palettes={A:['#203c48','#315562','#84a68b','#ffd578','#fff0b5','#e2b3e7'],B:['#1d202d','#383043','#79594c','#f09b55','#eed5a0','#d1b5dc'],C:['#151e36','#253456','#375275','#53e3dd','#fbe974','#cc90f5']};
let theme='A',t=0,playing=false,muted=true,last=0,speed=1; const images={};
for(const p of ['A','B','C'])for(const n of ['duck','rabbit','duck_idle_strip','duck_cast_strip','rabbit_idle_strip','rabbit_charge_strip','rabbit_impact_strip','rod']){let img=new Image();img.src='../character/'+p+'/'+n+'.png';images[p+n]=img;}
const clips={};for(const n of ['cloud_transfer','lightning','rabbit_charge','rabbit_hit','forge','temper']){clips[n]=new Audio('../audio/'+n+'.wav');clips[n].volume=0.5;}
const cues=[[1.8,'cloud_transfer'],[1.8,'rabbit_hit'],[2,'rabbit_charge'],[3,'forge'],[5,'lightning'],[5,'temper'],[6,'rabbit_hit'],[6,'cloud_transfer']];
function silence(){Object.values(clips).forEach(a=>{a.pause();a.currentTime=0})}function cue(a,b){if(muted)return;for(const [at,n] of cues)if(a<at&&b>=at){let v=clips[n];v.currentTime=0;v.playbackRate=speed;v.play().catch(()=>{});}}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function txt(s,x,y,size=18,c='#f6eedc'){ctx.fillStyle=c;ctx.font=`600 ${size}px system-ui,sans-serif`;ctx.fillText(s,x,y)}
function bar(x,y,w,v,c){rect(x,y,w,12,'#111c2a');rect(x,y,Math.max(0,w*v),12,c)}
function sprite(n,x,y,flip=false){let state=n==='duck'?'idle':t>=2&&t<4?'charge':t>=6&&t<6.35?'impact':'idle';let im=images[theme+n+'_'+state+'_strip'];if(!im||!im.complete||!im.naturalWidth)im=images[theme+n];ctx.save();ctx.translate(Math.round(x),Math.round(y));if(flip)ctx.scale(-1,1);ctx.imageSmoothingEnabled=false;if(im.complete&&im.naturalWidth){if(im.naturalWidth>64)ctx.drawImage(im,64*(Math.floor(t*8)%4),0,64,64,-64,-128,128,128);else ctx.drawImage(im,-64,-128,128,128)}else{rect(-35,-65,70,60,n==='duck'?'#f8d671':'#d7a9e9');txt(n==='duck'?'鸭':'兔',-16,-32,22,'#152432')}ctx.restore()}
function stored(){return t<1.8?8*t:t<2?8*(t-1.8):t<4?1.6+12*(t-2):t<6?25.6+8*(t-4):8*(t-6)}
function positions(){let dx=280,rx=680;if(t>=1.3&&t<2.4){let q=Math.max(0,1-Math.abs(t-1.8)/.5);dx+=160*q;rx-=160*q}if(t>=5.5&&t<6.5){let q=Math.max(0,1-Math.abs(t-6)/.5);dx+=160*q;rx-=160*q}return [dx,rx]}
function render(){let p=palettes[theme];ctx.clearRect(0,0,960,540);rect(0,0,960,540,p[0]);rect(24,128,912,338,p[1]);for(let y=150;y<450;y+=32)for(let x=40;x<930;x+=32){rect(x,y,28,28,(x/32+y/32)%2>.9?p[1]:p[0]);}rect(24,456,912,10,p[2]);for(let x=48;x<920;x+=48){rect(x,133,24,8,p[2]);rect(x,435,24,8,p[2])}txt('倒霉鸭',28,34,24,p[4]);txt('锻造兔',690,34,24,p[5]);txt('概念动画 · 未接入游戏',345,30,15,'#b6c4cf');
let hpD=t<1.8?100:t<6?85.6:23.2,hpR=t<5?100:68;bar(28,47,240,hpD/100,p[4]);bar(690,47,240,hpR/100,p[5]);txt('生命 '+hpD.toFixed(1),28,80,16);txt('生命 '+hpR.toFixed(0),690,80,16);txt('改时 '+(t<3?3-t:9-t).toFixed(1)+'秒  /  避雷针 '+(t<2?2-t:8-t).toFixed(1)+'秒',28,109,15);txt('锻造 '+(t<2?2-t:9-t).toFixed(1)+'秒 / 淬火 '+(t<5?5-t:13-t).toFixed(1)+'秒',640,109,15);
let [dx,rx]=positions();rect(dx-44,383,88,12,'#152532');rect(rx-44,383,88,12,'#152532');sprite('duck',dx,390);sprite('rabbit',rx,390,true);if(t>=2){let rod=images[theme+'rod'];if(rod.complete&&rod.naturalWidth)ctx.drawImage(rod,198,326,64,64)}
let holder=t<1.8?'鸭':t<5?'兔':t<6?'鸭':'兔';let cx=holder==='鸭'?dx:rx;let storm=t<3?7-t:t<5?5-t:12-t;rect(cx-49,176,98,30,'#94a9bb');rect(cx-35,163,28,14,'#b7cad5');rect(cx+1,157,32,20,'#b7cad5');rect(cx-61,184,14,16,'#70899c');txt('雷云 '+storm.toFixed(1)+'秒',cx-60,147,17,p[3]);txt('持有：'+holder,cx-36,230,14);
if(t>=1.8&&t<2.2||t>=6&&t<6.4){txt('雷云转移',395,245,22,p[3]);for(let x=330;x<630;x+=20)rect(x,255,8,5,p[3]);}
if(t>=2&&t<4){let q=(t-2)/2;bar(rx-52,409,104,q,p[3]);rect(rx-84,428,170,25,p[0]);txt('锻造中 · 12 / 秒',rx-75,448,16,p[3]);for(let j=0;j<5;j++)rect(rx-30+j*14,302-Math.sin(t*15+j)*12,5,5,p[3]);}
if(t>=5&&t<6){rect(rx-69,390,138,5,p[3]);txt('淬火 ×1.5',rx-55,286,18,p[3]);}
if(t>=5&&t<5.25){ctx.strokeStyle='#fff3a0';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(rx,202);ctx.lineTo(rx-25,250);ctx.lineTo(rx+14,246);ctx.lineTo(rx-6,331);ctx.stroke();txt('−32',rx+55,302,24,p[3]);}
if(t>=6&&t<6.4){let q=(t-6)/.4;ctx.strokeStyle=p[3];ctx.lineWidth=6;ctx.strokeRect(dx-30-q*55,330-q*45,60+q*110,60+q*90);txt('重击 −62.4',350,301,24,p[3]);}
txt('累计蓄力 '+stored().toFixed(1),638,501,22,p[5]);txt('时间 '+t.toFixed(1)+' / 8.0 秒',28,501,18);$('timeline').value=t;
$('event').textContent=t<1.8?'开场：雷云在鸭子身上，兔子按 8 / 秒积累伤害。':t<2?'第一次接触：雷云转到兔子；兔子释放 14.4 蓄力并归零。':t<3?'兔子进入 2 秒锻造：积累速率提高到 12 / 秒。':t<4?'鸭子改时技能触发：雷云在对手身上，倒计时减 2 秒。':t<5?'锻造结束，恢复 8 / 秒积累；雷云即将落下。':t<6?'落雷造成 32 伤害，云回鸭子并重置 7 秒；兔子淬火生效。':'第二次接触：兔子释放 41.6 × 1.5 = 62.4，蓄力与淬火清零；云转到兔子。';}
function frame(now){if(playing){let next=Math.min(8,t+(now-last)/1000*speed);cue(t,next);t=next;if(t===8){playing=false;$('play').textContent='播放';silence()}}last=now;render();requestAnimationFrame(frame)}
$('play').onclick=()=>{if(t===8)t=0;playing=!playing;$('play').textContent=playing?'暂停':'播放';if(!playing)silence()};$('restart').onclick=()=>{silence();t=0;playing=true;$('play').textContent='暂停'};$('mute').onclick=()=>{muted=!muted;$('mute').textContent='声音：'+(muted?'关':'开');if(muted)silence()};$('theme').onchange=e=>theme=e.target.value;$('speed').onchange=e=>{speed=+e.target.value;silence()};$('timeline').oninput=e=>{t=+e.target.value;silence();render()};document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;silence();$('play').textContent='播放'}});requestAnimationFrame(frame);
</script></html>
