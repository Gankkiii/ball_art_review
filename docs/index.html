<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>方向预览</title>
<style>
  :root {
    --bg: #0d1217;
    --panel: #18212a;
    --panel-deep: #0f161d;
    --line: #2f3e4b;
    --ink: #f2f6f4;
    --muted: #9cabb6;
    --accent: #65d6ad;
    --focus: #f2b95b;
  }

  * { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-width: 0;
    min-height: 100svh;
    background:
      linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
      var(--bg);
    background-size: 24px 24px, 24px 24px, auto;
    color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }

  button, textarea, input { font: inherit; }

  .page {
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
    padding:
      max(12px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(20px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
  }

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 3px 12px;
    padding: 2px 2px 10px;
  }

  h1 {
    margin: 0;
    font-size: clamp(21px, 5.4vw, 28px);
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: 0.06em;
  }

  .material-note {
    margin: 0;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
    letter-spacing: 0.04em;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .card {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    margin: 0;
    padding: 0;
    overflow: hidden;
    border: 2px solid var(--line);
    border-radius: 3px;
    background: #14202c;
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.04),
      0 3px 0 rgba(0, 0, 0, 0.28);
    color: var(--ink);
    cursor: zoom-in;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: transform 120ms ease, border-color 120ms ease;
  }

  .card:hover { border-color: #536777; }
  .card:active { transform: translateY(1px); }

  .card:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  .card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
    user-select: none;
    -webkit-user-drag: none;
  }

  .zoom-icon {
    position: absolute;
    right: 6px;
    bottom: 6px;
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 2px;
    background: rgba(10, 16, 22, 0.82);
    color: #fff;
    pointer-events: none;
  }

  .zoom-icon svg {
    display: block;
    width: 15px;
    height: 15px;
  }

  .feedback {
    margin-top: 14px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--panel);
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.24);
  }

  fieldset {
    min-width: 0;
    margin: 0;
    padding: 0;
    border: 0;
  }

  legend {
    margin: 0 0 6px;
    padding: 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
    letter-spacing: 0.06em;
  }

  .segmented {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 4px;
    padding: 4px;
    border: 1px solid #24323d;
    border-radius: 3px;
    background: var(--panel-deep);
  }

  .segmented label {
    position: relative;
    display: block;
    min-width: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .segmented input {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: 0;
    opacity: 0;
    pointer-events: none;
  }

  .segmented span {
    display: grid;
    place-items: center;
    min-height: 40px;
    padding: 4px 2px;
    border: 1px solid transparent;
    border-radius: 2px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.2;
    font-weight: 700;
    text-align: center;
    transition: background-color 120ms ease, color 120ms ease;
  }

  .segmented label:hover span { color: var(--ink); }

  .segmented input:checked + span {
    border-color: rgba(13, 18, 23, 0.3);
    background: var(--accent);
    color: #0d1217;
  }

  .segmented input:focus-visible + span {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }

  .feedback-entry {
    margin-top: 12px;
  }

  .feedback-entry label {
    display: block;
    margin-bottom: 5px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
    letter-spacing: 0.06em;
  }

  textarea {
    display: block;
    width: 100%;
    min-height: 76px;
    margin: 0;
    padding: 10px 11px;
    resize: vertical;
    border: 1px solid #334451;
    border-radius: 3px;
    background: #0d141a;
    color: var(--ink);
    caret-color: var(--accent);
    font-size: 15px;
    line-height: 1.55;
  }

  textarea:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
    border-color: var(--focus);
  }

  .scope {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
    letter-spacing: 0.03em;
  }

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding:
      max(64px, calc(env(safe-area-inset-top) + 56px))
      max(16px, env(safe-area-inset-right))
      max(20px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
    background: rgba(5, 9, 13, 0.94);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }

  .lightbox[hidden] { display: none; }

  .lightbox img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: calc(100svh - 108px);
    border: 2px solid #526575;
    background: #14202c;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    image-rendering: pixelated;
  }

  .lightbox-close {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    padding: 0;
    border: 2px solid #0d1217;
    border-radius: 3px;
    background: var(--ink);
    color: #0d1217;
    box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .lightbox-close svg {
    display: block;
    width: 22px;
    height: 22px;
  }

  .lightbox-close:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  body.lightbox-open { overflow: hidden; }

  @media (min-width: 700px) {
    .page { padding-top: max(18px, env(safe-area-inset-top)); }
    .masthead { padding-bottom: 12px; }
    .gallery { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .feedback { margin-top: 16px; }
    .feedback-inner {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .feedback-entry { margin-top: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<main class="page">
  <header class="masthead">
    <h1>方向预览</h1>
    <p class="material-note">合成示意 · 仅图片，暂无视频</p>
  </header>

  <section class="gallery">
    <button class="card" type="button" aria-label="放大 A" data-image="assets/fixture-a.svg">
      <img src="assets/fixture-a.svg" alt="A 合成示意图" width="320" height="240" draggable="false">
      <span class="zoom-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true" focusable="false">
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <path d="M15.5 15.5 21 21M10.5 7.5v6M7.5 10.5h6"></path>
        </svg>
      </span>
    </button>

    <button class="card" type="button" aria-label="放大 B" data-image="assets/fixture-b.svg">
      <img src="assets/fixture-b.svg" alt="B 合成示意图" width="320" height="240" draggable="false">
      <span class="zoom-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true" focusable="false">
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <path d="M15.5 15.5 21 21M10.5 7.5v6M7.5 10.5h6"></path>
        </svg>
      </span>
    </button>

    <button class="card" type="button" aria-label="放大 C" data-image="assets/fixture-c.svg">
      <img src="assets/fixture-c.svg" alt="C 合成示意图" width="320" height="240" draggable="false">
      <span class="zoom-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true" focusable="false">
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <path d="M15.5 15.5 21 21M10.5 7.5v6M7.5 10.5h6"></path>
        </svg>
      </span>
    </button>

    <button class="card" type="button" aria-label="放大 D" data-image="assets/fixture-d.svg">
      <img src="assets/fixture-d.svg" alt="D 合成示意图" width="320" height="240" draggable="false">
      <span class="zoom-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true" focusable="false">
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <path d="M15.5 15.5 21 21M10.5 7.5v6M7.5 10.5h6"></path>
        </svg>
      </span>
    </button>
  </section>

  <section class="feedback">
    <div class="feedback-inner">
      <fieldset>
        <legend>反馈对象</legend>
        <div class="segmented">
          <label><input type="radio" name="feedback-target" value="整体" checked><span>整体</span></label>
          <label><input type="radio" name="feedback-target" value="A"><span>A</span></label>
          <label><input type="radio" name="feedback-target" value="B"><span>B</span></label>
          <label><input type="radio" name="feedback-target" value="C"><span>C</span></label>
          <label><input type="radio" name="feedback-target" value="D"><span>D</span></label>
        </div>
      </fieldset>

      <div class="feedback-entry">
        <label for="feedback">反馈</label>
        <textarea id="feedback" rows="3" autocomplete="off" spellcheck="false"></textarea>
        <p class="scope">仅本页编辑，关闭后不保留</p>
      </div>
    </div>
  </section>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="方向预览" hidden>
  <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true" focusable="false">
      <path d="M5 5l14 14M19 5 5 19"></path>
    </svg>
  </button>
  <img id="lightbox-image" src="assets/fixture-a.svg" alt="">
</div>

<script>
  (function () {
    "use strict";

    var lightbox = document.getElementById("lightbox");
    var lightboxImage = document.getElementById("lightbox-image");
    var closeButton = document.getElementById("lightbox-close");
    var page = document.querySelector("main");
    var cards = Array.prototype.slice.call(document.querySelectorAll(".card"));
    var lastTrigger = null;

    function isOpen() {
      return !lightbox.hidden;
    }

    function openLightbox(card) {
      var image = card.querySelector("img");
      lastTrigger = card;
      lightboxImage.src = card.getAttribute("data-image");
      lightboxImage.alt = image ? image.alt : "";
      lightbox.hidden = false;
      page.setAttribute("inert", "");
      document.body.classList.add("lightbox-open");
      closeButton.focus();
    }

    function closeLightbox() {
      if (!isOpen()) return;
      lightbox.hidden = true;
      page.removeAttribute("inert");
      document.body.classList.remove("lightbox-open");
      if (lastTrigger) {
        lastTrigger.focus();
        lastTrigger = null;
      }
    }

    cards.forEach(function (card) {
      card.addEventListener("click", function () {
        openLightbox(card);
      });
    });

    closeButton.addEventListener("click", closeLightbox);

    lightbox.addEventListener("click", function (event) {
      if (event.target === lightbox) closeLightbox();
    });

    document.addEventListener("keydown", function (event) {
      if (!isOpen()) return;

      if (event.key === "Escape") {
        event.preventDefault();
        closeLightbox();
        return;
      }

      if (event.key === "Tab") {
        event.preventDefault();
        closeButton.focus();
      }
    });
  }());
</script>
</body>
</html>
