<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="900" fill="#F7EBCD" stroke="#F7EBCD" stroke-width="0"/><rect x="0" y="0" width="1600" height="88" fill="#243746" stroke="#243746" stroke-width="0"/><text x="32" y="56" font-size="34" font-weight="800" fill="#F7EBCD">BALLS</text><rect x="888" y="18" width="150" height="52" fill="#243746" stroke="#F7EBCD" stroke-width="2"/><text x="926" y="54" font-size="24" font-weight="700" fill="#F7EBCD">竞技场</text><rect x="1058" y="18" width="150" height="52" fill="#243746" stroke="#F7EBCD" stroke-width="2"/><text x="1096" y="54" font-size="24" font-weight="700" fill="#F7EBCD">主线</text><rect x="1228" y="18" width="150" height="52" fill="#243746" stroke="#F7EBCD" stroke-width="2"/><text x="1266" y="54" font-size="24" font-weight="700" fill="#F7EBCD">仓库</text><rect x="1398" y="18" width="150" height="52" fill="#EFC65B" stroke="#EFC65B" stroke-width="2"/><text x="1436" y="54" font-size="24" font-weight="700" fill="#243746">孵蛋</text><text x="42" y="140" font-size="36" font-weight="800" fill="#243746">孵蛋</text><text x="154" y="138" font-size="26" font-weight="600" fill="#243746">选择亲本与规则说明</text><rect x="1290" y="111" width="264" height="36" fill="#D9BA8C" stroke="#243746" stroke-width="2"/><text x="1302" y="137" font-size="19" font-weight="700" fill="#243746">概念UI · 人工样例</text><path d="M40 161 L1560 161" fill="none" stroke="#D9BA8C" stroke-width="2" /><text x="40" y="877" font-size="19" font-weight="500" fill="#687A7D">精灵等级 Lv.0 与技能阶级 +3 分开显示；预览不提前生成随机结果。</text><text x="1370" y="877" font-size="20" font-weight="700" fill="#243746">方案 A</text><rect x="45" y="190" width="655" height="632" fill="#FFF9EB" stroke="#243746" stroke-width="3"/><text x="75" y="244" font-size="32" font-weight="800" fill="#243746">先选择一母一父</text><rect x="75" y="285" width="595" height="151" fill="#F7EBCD" stroke="#243746" stroke-width="2"/><rect x="95" y="303" width="160" height="36" fill="#D5C6E5" stroke="#243746" stroke-width="2"/><text x="107" y="329" font-size="19" font-weight="700" fill="#243746">母亲 ♀</text><text x="95" y="383" font-size="26" font-weight="700" fill="#243746">尚未选择</text><rect x="398" y="354" width="244" height="54" fill="#FFF9EB" stroke="#243746" stroke-width="3"/><text x="418" y="390" font-size="23" font-weight="700" fill="#243746">选择亲本 →</text><rect x="75" y="469" width="595" height="151" fill="#F7EBCD" stroke="#243746" stroke-width="2"/><rect x="95" y="487" width="160" height="36" fill="#A9D8C9" stroke="#243746" stroke-width="2"/><text x="107" y="513" font-size="19" font-weight="700" fill="#243746">父亲 ♂</text><text x="95" y="567" font-size="26" font-weight="700" fill="#243746">尚未选择</text><rect x="398" y="538" width="244" height="54" fill="#FFF9EB" stroke="#243746" stroke-width="3"/><text x="418" y="574" font-size="23" font-weight="700" fill="#243746">选择亲本 →</text><text x="75" y="683" font-size="25" font-weight="700" fill="#243746">缺任一亲本，不显示孵化操作。</text><text x="75" y="728" font-size="23" font-weight="500" fill="#243746">选择后查看后代预览，再选择并列技能。</text><text x="75" y="777" font-size="23" font-weight="500" fill="#243746">无成本、倒计时或亲本消耗。</text><rect x="730" y="190" width="825" height="632" fill="#FFF9EB" stroke="#243746" stroke-width="3"/><rect x="760" y="214" width="760" height="36" fill="#D9BA8C" stroke="#243746" stroke-width="2"/><text x="772" y="240" font-size="19" font-weight="700" fill="#243746">当前代码临时规则 · 不代表长期平衡已确认</text><text x="760" y="293" font-size="22" font-weight="700" fill="#243746">技能 1：母亲最高阶技能；并列才由你二选一。</text><text x="760" y="341" font-size="22" font-weight="500" fill="#243746">强化阶级：父母各自最高阶之间随机，含两端。</text><text x="760" y="389" font-size="22" font-weight="500" fill="#243746">较高值未到 +10 时，另有 1% 覆盖为较高值 +1。</text><text x="760" y="437" font-size="22" font-weight="500" fill="#243746">本人工 +3 / +3 样例：99% 为 +3，1% 为 +4。</text><text x="760" y="500" font-size="22" font-weight="700" fill="#243746">技能 2：母种族 5 池排除技能 1，余 4 项随机。</text><text x="760" y="548" font-size="22" font-weight="500" fill="#243746">其中 3 项待设计，不提前确定身份或战斗效果。</text><text x="760" y="596" font-size="22" font-weight="500" fill="#243746">技能 2 阶级 +1～+9，概率随阶级递减：</text><text x="760" y="644" font-size="22" font-weight="500" fill="#243746">权重依次 9 : 8 : 7 : 6 : 5 : 4 : 3 : 2 : 1。</text><text x="760" y="707" font-size="22" font-weight="700" fill="#243746">后代精灵始终 Lv.0，技能 +n 不是精灵等级。</text><text x="760" y="755" font-size="22" font-weight="500" fill="#243746">种族 / 特性随母；先天六项分别在双亲范围随机。</text><text x="760" y="791" font-size="22" font-weight="500" fill="#243746">后天全 0；种族基础 / 最终仍待定。</text></g></svg>